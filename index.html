<style>
  :root{
    --bg:#0F1613; --panel:#16211B; --panel-2:#1C2921; --line:#2A362F;
    --text:#F1EDE4; --text-muted:#92A196;
    --prot:#3D7BFF; --prot-soft:rgba(61,123,255,0.14);
    --carb:#F0B429; --carb-soft:rgba(240,180,41,0.14);
    --fat:#9B8CF2; --fat-soft:rgba(155,140,242,0.14);
    --warn:#E4573D;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    height:100%; margin:0; background:var(--bg); color:var(--text);
    font-family:'Work Sans',system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Big Shoulders Display',system-ui,sans-serif; font-weight:700; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select{
    font-family:inherit; font-size:14px; color:var(--text); background:var(--panel-2);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px; width:100%;
  }
  label{display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  button.btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    border-radius:8px; padding:11px 14px; font-size:14px; font-weight:500;
  }
  button.btn-primary{background:var(--prot); border-color:var(--prot); color:#fff; font-weight:600;}
  button.btn-ghost{background:transparent; border-color:transparent; color:var(--text-muted); padding:6px 8px;}
  .note{font-size:11.5px; color:var(--text-muted); line-height:1.5;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin:0 14px 14px;}
  .card h3{font-size:13px; color:var(--text-muted); font-family:'Work Sans'; font-weight:600; margin-bottom:10px;}

  .histNav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .histNav .navBtn{background:none; border:1px solid var(--line); border-radius:6px; color:var(--text); width:30px; height:30px; font-size:15px;}
  .histNav .monthLabel{font-family:'Big Shoulders Display'; font-weight:700; font-size:15px; text-transform:capitalize;}

  .calGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .calDow{font-size:9.5px; color:var(--text-muted); text-align:center; padding-bottom:2px;}
  .calCell{aspect-ratio:1; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:10.5px; color:var(--text-muted); background:var(--panel-2); border:1px solid var(--line);}
  .calCell.empty{background:none; border:none;}
  .calCell.good{background:rgba(111,207,151,0.28); border-color:#6FCF97; color:#F1EDE4;}
  .calCell.partial{background:var(--carb-soft); border-color:var(--carb); color:#F1EDE4;}
  .calLegend{display:flex; gap:12px; font-size:10.5px; color:var(--text-muted); margin-top:8px; flex-wrap:wrap;}
  .calLegend span{display:flex; align-items:center; gap:4px;}
  .calLegend i{width:9px; height:9px; border-radius:3px; display:inline-block;}

  .histStats{display:flex; gap:10px; margin:12px 0; flex-wrap:wrap;}
  .histStat{flex:1; min-width:90px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px;}
  .histStat .n{font-family:'Big Shoulders Display'; font-weight:700; font-size:19px;}
  .histStat .l{font-size:10.5px; color:var(--text-muted);}

  .trendScroll{overflow-x:auto; margin:4px -2px;}
  .trendLegend{display:flex; flex-wrap:wrap; gap:12px 16px; font-size:11.5px; color:var(--text-muted); margin-top:8px;}
  .trendLegend span{display:flex; align-items:center; gap:5px;}
  .trendLegend i{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .yearStrip{display:flex; gap:4px; margin-top:4px;}
  .yearCell{flex:1; text-align:center;}
  .yearBar{height:46px; border-radius:4px; background:var(--panel-2); border:1px solid var(--line); display:flex; align-items:flex-end; overflow:hidden;}
  .yearBar i{width:100%; display:block; background:#6FCF97;}
  .yearCell .m{font-size:9px; color:var(--text-muted); margin-top:3px;}

  .streakRow{display:flex; align-items:center; gap:12px;}
  .streakNum{font-family:'Big Shoulders Display'; font-weight:800; font-size:34px; color:var(--carb);}
  .streakLabel{font-size:12px; color:var(--text-muted);}
  .badgeRow{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .badge{flex:1; min-width:56px; text-align:center; padding:8px 4px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line); opacity:0.35;}
  .badge.on{opacity:1; border-color:var(--carb); background:var(--carb-soft);}
  .badge .ic{font-size:18px;}
  .badge .lb{font-size:9.5px; color:var(--text-muted); margin-top:2px;}

  .weekGrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}

  .weighNote{border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-muted);}
  .weighNote.due{background:var(--carb-soft); border-color:var(--carb); color:var(--text);}

  .waBtn{width:100%; background:#25D366; border-color:#25D366; color:#08331c; font-weight:700;}

  .checkRow{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line);}
  .checkRow:last-child{border-bottom:none;}
  .checkBtn{font-size:24px; background:none; border:none; cursor:pointer; line-height:1; padding:2px 4px;}

  .moreData{border:1px dashed var(--line); border-radius:8px; padding:8px 10px;}
  .moreData summary{cursor:pointer; font-size:12px; color:var(--text-muted); list-style:none;}
  .moreData summary::-webkit-details-marker{display:none;}
  .moreData[open] summary{color:var(--text);}

  /* ---- gate ---- */
  #gate{
    min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
  }
  .gateBox{max-width:340px; width:100%; text-align:center;}
  .gateBox h1{font-size:26px; margin-bottom:6px;}
  .gateBox p{color:var(--text-muted); font-size:13.5px; margin:0 0 18px;}
  .gateBox input{text-align:center; letter-spacing:2px; font-size:16px;}
  .gateBox .btn-primary{width:100%; margin-top:10px;}
  .gateErr{color:var(--warn); font-size:12.5px; margin-top:8px; display:none;}

  /* ---- top gauges ---- */
  #topBar{position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
    padding-top:calc(10px + env(safe-area-inset-top,0px)); padding-bottom:6px;}
  .topBarHead{display:flex; align-items:center; justify-content:space-between; padding:0 14px 6px;}
  .topBarHead h1{font-size:17px;}
  .topBarHead .sub{font-size:11px; color:var(--text-muted);}
  .gearBtn{background:none; border:none; color:var(--text-muted); font-size:16px; padding:4px;}
  .gaugeRow{display:flex; justify-content:space-around; gap:4px; padding:0 8px;}
  .gaugeItem{flex:1; max-width:120px; text-align:center;}
  .gaugeSvg{width:100%; height:auto; display:block;}
  .gaugeLabel{font-size:10.5px; color:var(--text-muted); margin-top:-6px; font-weight:600;}
  .gaugeSub{font-size:9.5px; color:var(--text-muted); margin-top:-2px;}

  /* ---- log ---- */
  .foodRow{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .foodRow:last-child{border-bottom:none;}
  .foodRow .fname{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .foodRow .fmacros{font-size:11px; color:var(--text-muted); white-space:nowrap;}
  .foodRow .fdel{background:none; border:none; color:var(--text-muted); font-size:15px; padding:2px 4px;}
  .foodRow .fdel:hover{color:var(--warn);}
  .memberInfo{flex:1; min-width:0; white-space:normal; word-break:break-word;}
  .addRow{display:flex; gap:8px; align-items:flex-end; margin-top:10px;}
  .addRow .field{flex:1; margin-bottom:0;}
  .qtyField{width:70px; flex:none !important;}

  .estimateBox{background:var(--panel-2); border:1px dashed var(--line); border-radius:8px; padding:12px; margin-top:10px;}
  .estimateBox .row2{margin-bottom:0;}

  .proteinTip{border-radius:8px; padding:11px 12px; font-size:13px; margin-top:4px;}
  .proteinTip.short{background:var(--carb-soft); border:1px solid rgba(240,180,41,0.4); color:var(--text);}
  .proteinTip.ok{background:rgba(111,207,151,0.12); border:1px solid rgba(111,207,151,0.4); color:#6FCF97;}

  .hidden{display:none !important;}
</style>
</head>

  function todayKey(){
    var d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function fmt(n,d){ return (n==null||isNaN(n)) ? '—' : n.toFixed(d===undefined?0:d); }

  // ---------- toast (los diálogos nativos alert/confirm/prompt no funcionan dentro del artifact) ----------
  var toastTimer = null;
  function showToast(text, isError){
    var el = document.getElementById('appToast');
    if(!el){
      el = document.createElement('div');
      el.id = 'appToast';
      el.style.cssText = 'position:fixed; left:50%; bottom:24px; transform:translateX(-50%); max-width:90%; padding:10px 16px; border-radius:10px; font-size:13.5px; z-index:9999; box-shadow:0 4px 16px rgba(0,0,0,.35); text-align:center;';
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.style.background = isError ? '#4a1f1f' : '#1f3a2a';
    el.style.color = isError ? '#ff8a8a' : '#8ff0b2';
    el.style.border = '1px solid ' + (isError ? '#8a3030' : '#2f6b46');
    el.style.display = 'block';
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.style.display = 'none'; }, 3200);
  }

  // caja de copiado manual (fallback cuando no hay clipboard ni share nativo)
  function showCopyBox(text){
    var old = document.getElementById('copyBoxOverlay');
    if(old) old.remove();
    var overlay = document.createElement('div');
    overlay.id = 'copyBoxOverlay';
    overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:9998; display:flex; align-items:center; justify-content:center; padding:20px;';
    overlay.innerHTML = '<div style="background:var(--panel,#16211B); border-radius:12px; padding:16px; max-width:420px; width:100%;">' +
      '<p style="margin:0 0 8px; font-size:13px; color:#ccc;">No se pudo compartir automáticamente. Selecciona el texto y cópialo manualmente:</p>' +
      '<textarea id="copyBoxText" readonly style="width:100%; height:160px; border-radius:8px; padding:8px; font-size:12.5px;"></textarea>' +
      '<button id="copyBoxClose" class="btn btn-primary" style="width:100%; margin-top:10px;">Cerrar</button>' +
    '</div>';
    document.body.appendChild(overlay);
    var ta = document.getElementById('copyBoxText');
    ta.value = text;
    ta.focus(); ta.select();
    document.getElementById('copyBoxClose').addEventListener('click', function(){ overlay.remove(); });
  }

  // caja de entrada de texto/número (fallback de prompt())
  function showInlinePrompt(opts){
    var old = document.getElementById('inputBoxOverlay');
    if(old) old.remove();
    var overlay = document.createElement('div');
    overlay.id = 'inputBoxOverlay';
    overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:9998; display:flex; align-items:center; justify-content:center; padding:20px;';
    overlay.innerHTML = '<div style="background:var(--panel,#16211B); border-radius:12px; padding:16px; max-width:380px; width:100%;">' +
      '<p style="margin:0 0 10px; font-size:14px; color:#eee;">'+escapeHtml(opts.title||'')+'</p>' +
      '<input id="inputBoxField" type="'+(opts.type||'text')+'" value="'+escapeHtml(opts.value!=null?String(opts.value):'')+'" placeholder="'+escapeHtml(opts.placeholder||'')+'" style="width:100%; padding:10px; border-radius:8px; font-size:15px; box-sizing:border-box;">' +
      '<div style="display:flex; gap:8px; margin-top:12px;">' +
        '<button id="inputBoxCancel" class="btn" style="flex:1;">Cancelar</button>' +
        '<button id="inputBoxOk" class="btn btn-primary" style="flex:1;">Guardar</button>' +
      '</div>' +
    '</div>';
    document.body.appendChild(overlay);
    var field = document.getElementById('inputBoxField');
    field.focus(); field.select();
    function close(){ overlay.remove(); }
    document.getElementById('inputBoxCancel').addEventListener('click', close);
    document.getElementById('inputBoxOk').addEventListener('click', function(){
      var v = field.value;
      close();
      if(opts.onSubmit) opts.onSubmit(v);
    });
    field.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ document.getElementById('inputBoxOk').click(); }
    });
  }

  // botón de dos toques: primer click pide confirmar, segundo click (antes de 4s) ejecuta la acción
  function armConfirmButton(btn, confirmLabel, onConfirm){
    if(btn.getAttribute('data-confirming') === '1'){
      clearTimeout(btn._confirmTimer);
      btn.removeAttribute('data-confirming');
      btn.textContent = btn.getAttribute('data-original-label');
      btn.style.background = '';
      onConfirm();
      return;
    }
    if(!btn.getAttribute('data-original-label')) btn.setAttribute('data-original-label', btn.textContent);
    btn.setAttribute('data-confirming', '1');
    btn.textContent = confirmLabel;
    btn.style.background = 'var(--warn)';
    btn._confirmTimer = setTimeout(function(){
      btn.removeAttribute('data-confirming');
      btn.textContent = btn.getAttribute('data-original-label');
      btn.style.background = '';
    }, 4000);
  }

  // ---------- local storage ----------
  function loadLocal(key, fallback){
    try{ var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; }
  }
  function saveLocal(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  // ---------- gate ----------
  function initFirebaseDb(){
    try{
      if(!window.firebase || !window.firebase.initializeApp) return null;
      if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
      return firebase.firestore();
    }catch(e){ return null; }
  }

  async function initGate(){
    state.db = initFirebaseDb();

    var ownerOk = null;
    try{ ownerOk = localStorage.getItem('macros_owner_pin_ok'); }catch(e){}
    state.isOwner = (ownerOk === '1');

    if(state.db){
      try{
        state.db.doc('config/acceso').onSnapshot(function(snap){
          var data = null;
          try{ data = snap && snap.data ? snap.data() : null; }catch(e){ data = null; }
          state.configWhatsapp = (data && data.whatsapp) ? String(data.whatsapp) : null;
        }, function(){});
      }catch(e){}
      try{
        state.db.collection('miembros').onSnapshot(function(snap){
          var map = {};
          snap.docs.forEach(function(d){ map[d.id] = d.data(); });
          state.miembros = map;
          if(state.isOwner){ if(!appHidden()) renderOwnerPanelIfVisible(); }
          else { checkAccess(); }
        }, function(){ if(!state.isOwner) renderGate('signin'); });
      }catch(e){ if(!state.isOwner) renderGate('signin'); }
    }

    if(state.isOwner){ enterApp(); return; }
    if(!state.db){ renderGate('signin'); return; }
  }

  function appHidden(){ return document.getElementById('app').classList.contains('hidden'); }

  function findMemberByCode(code){
    var ids = Object.keys(state.miembros||{});
    var norm = String(code).trim().toUpperCase();
    for(var i=0;i<ids.length;i++){
      if(String(state.miembros[ids[i]].codigo||'').trim().toUpperCase() === norm) return Object.assign({id:ids[i]}, state.miembros[ids[i]]);
    }
    return null;
  }

  function myDeviceId(){
    var id = null;
    try{ id = localStorage.getItem('macros_device_id'); }catch(e){}
    if(!id){
      id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      try{ localStorage.setItem('macros_device_id', id); }catch(e){}
    }
    return id;
  }

  function registerDevice(match){
    if(!state.db || !match) return;
    var dev = myDeviceId();
    var current = match.dispositivos || [];
    if(current.indexOf(dev) !== -1) return; // ya registrado, nada que hacer
    var updated = current.concat([dev]);
    try{ state.db.doc('miembros/'+match.id).update({dispositivos: updated}); }catch(e){}
  }

  function checkAccess(){
    var saved = null;
    try{ saved = localStorage.getItem('macros_member_code'); }catch(e){}
    var match = saved ? findMemberByCode(saved) : null;

    if(match && match.activo){
      state.myMember = match;
      registerDevice(match);
      if(appHidden()) enterApp();
      return;
    }

    // no válido (nunca tuvo código, código borrado, o fue desactivado)
    if(!appHidden()){
      // estaba adentro y le acaban de quitar el acceso: la sacamos
      document.getElementById('app').classList.add('hidden');
      document.getElementById('gate').classList.remove('hidden');
    }
    renderGate(saved ? 'revoked' : 'need_code');
  }

  function renderGate(kind){
    var box = document.getElementById('gateBox');
    if(kind === 'signin'){
      box.innerHTML =
        '<h1>RETO TITANES</h1>' +
        '<p>No se pudo conectar con la base de datos. Revisa tu conexión a internet e intenta de nuevo.</p>' +
        '<button class="btn btn-primary" onclick="location.reload()">Reintentar</button>';
      return;
    }
    if(kind === 'revoked'){
      box.innerHTML =
        '<h1>RETO TITANES</h1>' +
        '<p>Tu acceso ya no está activo. Si crees que es un error, contacta a tu entrenador.</p>' +
        '<input id="codeInput" type="text" placeholder="Código" autocomplete="off">' +
        '<div class="gateErr" id="gateErr">Código incorrecto o desactivado.</div>' +
        '<button class="btn btn-primary" id="codeBtn">Entrar</button>' +
        '<p class="note" id="ownerLink" style="text-align:center; margin-top:14px; cursor:pointer; text-decoration:underline;">¿Eres el entrenador?</p>';
      document.getElementById('codeBtn').addEventListener('click', checkCode);
      document.getElementById('codeInput').addEventListener('keydown', function(e){ if(e.key==='Enter') checkCode(); });
      document.getElementById('ownerLink').addEventListener('click', promptOwnerPin);
      return;
    }
    box.innerHTML =
      '<h1>RETO TITANES</h1>' +
      '<p>Ingresa el código de acceso personal que te dio tu entrenador.</p>' +
      '<input id="codeInput" type="text" placeholder="Código" autocomplete="off">' +
      '<div class="gateErr" id="gateErr">Código incorrecto o desactivado.</div>' +
      '<button class="btn btn-primary" id="codeBtn">Entrar</button>' +
      '<p class="note" id="ownerLink" style="text-align:center; margin-top:14px; cursor:pointer; text-decoration:underline;">¿Eres el entrenador?</p>';
    document.getElementById('codeBtn').addEventListener('click', checkCode);
    document.getElementById('codeInput').addEventListener('keydown', function(e){ if(e.key==='Enter') checkCode(); });
    document.getElementById('ownerLink').addEventListener('click', promptOwnerPin);
  }

  function promptOwnerPin(){
    showInlinePrompt({
      title: 'PIN del entrenador',
      type: 'password',
      placeholder: 'PIN',
      onSubmit: function(val){
        fetch('/api/owner', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({pin: String(val).trim()})
        }).then(function(r){ return r.json(); }).then(function(d){
          if(d && d.ok){
            try{ localStorage.setItem('macros_owner_pin_ok', '1'); }catch(e){}
            state.isOwner = true;
            enterApp();
          } else {
            showToast('PIN incorrecto.', true);
          }
        }).catch(function(){ showToast('No se pudo verificar el PIN. Revisa tu conexión.', true); });
      }
    });
  }

  var failedAttempts = 0, lockUntil = 0;

  function checkCode(){
    if(Date.now() < lockUntil){
      document.getElementById('gateErr').textContent = 'Demasiados intentos. Espera un momento e intenta de nuevo.';
      document.getElementById('gateErr').style.display = 'block';
      return;
    }
    var val = (document.getElementById('codeInput').value || '').trim();
    var match = val ? findMemberByCode(val) : null;
    if(match && match.activo){
      failedAttempts = 0;
      try{ localStorage.setItem('macros_member_code', val); }catch(e){}
      state.myMember = match;
      registerDevice(match);
      enterApp();
    } else {
      failedAttempts++;
      if(failedAttempts >= 5){
        lockUntil = Date.now() + 30000;
        document.getElementById('gateErr').textContent = 'Demasiados intentos. Espera 30 segundos e intenta de nuevo.';
      } else {
        document.getElementById('gateErr').textContent = 'Código incorrecto o desactivado.';
      }
      document.getElementById('gateErr').style.display = 'block';
    }
  }

  // ---------- owner: whatsapp ----------
  async function openOwnerSettings(){
    var actualWa = state.configWhatsapp || '';
    showInlinePrompt({
      title: 'Tu WhatsApp para recibir resúmenes (código de país, sin espacios ni +, ej. 5217771234567). Actual: ' + (actualWa || 'sin configurar'),
      value: actualWa,
      type: 'tel',
      placeholder: '5217771234567',
      onSubmit: async function(nuevoWa){

        if(!state.db){ showToast('No se pudo guardar: no hay conexión a la base de datos.', true); return; }
        try{

          state.configWhatsapp = nuevoWa.trim().replace(/[^0-9]/g,'');

        }catch(e){ showToast('No se pudo guardar. Intenta de nuevo.', true); }
      }

  // ---------- owner: panel de miembros ----------
  function randomCode(){
    var letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // sin I/O para evitar confusión con 1/0
    var digitos = '23456789'; // sin 0/1 por la misma razón
    var pick = function(set){ return set[Math.floor(Math.random()*set.length)]; };
    return pick(letras)+pick(letras)+pick(digitos)+pick(digitos)+pick(digitos);
  }

  var ownerSearchQuery = '';

  function buildMemberRowsHtml(ids){
    return ids.map(function(id){
      var m = state.miembros[id];
      var devCount = (m.dispositivos||[]).length;
      var devTag = devCount > 1
        ? '<span class="tag" style="color:var(--carb); border-color:var(--carb); margin-left:6px;">'+devCount+' dispositivos ⚠️</span>'

        '<span class="memberInfo"><b>'+escapeHtml(m.nombre||'(sin nombre)')+'</b><br><span class="note">código: <b style="color:var(--text); letter-spacing:1px;">'+escapeHtml(m.codigo||'')+'</b></span>'+devTag+'</span>' +
        '<button class="btn btn-ghost memberToggle" data-id="'+id+'" style="'+(m.activo?'color:#6FCF97;':'color:var(--warn);')+'">'+(m.activo?'Activa ✓':'Bloqueada ✕')+'</button>' +
        '<button class="btn btn-ghost memberRegen" data-id="'+id+'" title="Generar código nuevo">🔄</button>' +
        '<button class="btn btn-ghost memberShare" data-id="'+id+'" title="Compartir link + código de acceso">📲</button>' +

      '</details>' +
      '<div class="checkRow">' +
        '<span>'+paymentBadgeHtml(m)+'</span>' +
        '<span>' +
          '<button class="btn btn-ghost memberPagoDia" data-id="'+id+'" title="Definir/editar día de pago" style="padding:4px 6px;">🗓️</button>' +

  function sortedMemberIds(){
    return Object.keys(state.miembros||{}).sort(function(a,b){
      return (state.miembros[a].nombre||'').localeCompare(state.miembros[b].nombre||'');
    });
  }

  function filteredMemberIds(){
    var ids = sortedMemberIds();
    var q = ownerSearchQuery.trim().toLowerCase();
    if(!q) return ids;
    return ids.filter(function(id){
      var m = state.miembros[id];
      return (m.nombre||'').toLowerCase().indexOf(q) !== -1 || (m.codigo||'').toLowerCase().indexOf(q) !== -1;
    });
  }

  // caja para compartir: siempre da un link real que se puede tocar (window.open/share/clipboard pueden estar bloqueados)
  function showShareBox(m, texto, waUrl){
    var old = document.getElementById('shareBoxOverlay');
    if(old) old.remove();
    var overlay = document.createElement('div');
    overlay.id = 'shareBoxOverlay';
    overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:9998; display:flex; align-items:center; justify-content:center; padding:20px;';
    overlay.innerHTML = '<div style="background:var(--panel,#16211B); border-radius:12px; padding:16px; max-width:420px; width:100%;">' +
      '<p style="margin:0 0 10px; font-size:14px; color:#eee;">Acceso para ' + escapeHtml(m.nombre||'') + '</p>' +
      (waUrl ? '<a href="'+waUrl+'" target="_blank" rel="noopener" class="btn btn-primary" style="display:block; text-align:center; text-decoration:none; margin-bottom:10px;">📲 Abrir WhatsApp</a>' : '') +

      '<button id="shareBoxClose" class="btn btn-primary" style="width:100%; margin-top:8px;">Cerrar</button>' +

      try{ await navigator.clipboard.writeText(texto); showToast('Copiado.', false); }
      catch(e){ ta.focus(); ta.select(); showToast('Selecciona y copia manualmente.', true); }
    });
    document.getElementById('shareBoxClose').addEventListener('click', function(){ overlay.remove(); });
  }

    var addBtn = document.getElementById('addMemberBtn');

      var nombre = document.getElementById('newMemberName').value.trim();
      var codigo = document.getElementById('newMemberCode').value.trim();

      try{
        await state.db.collection('miembros').add({nombre:nombre, codigo:codigo, telefono:telefono, diaPago:diaPago, ultimoPago:diaPago?Date.now():null, activo:true, dispositivos:[], creadoEn:Date.now()});

  // ---------- targets ----------
  function computeTargets(p, burnHoy){
    var bmrFormula = p.sexo==='hombre'
      ? (10*p.peso + 6.25*p.estatura - 5*p.edad + 5)
      : (10*p.peso + 6.25*p.estatura - 5*p.edad - 161);
    var bmr = (p.bmrManual && p.bmrManual > 0) ? p.bmrManual : bmrFormula;
    var bmrFuente = (p.bmrManual && p.bmrManual > 0) ? 'báscula' : 'fórmula';
    var baseTdee = bmr * 1.3; // vida diaria sin contar el entrenamiento — el entrenamiento se suma aparte
    var baseKcal = p.objetivo==='bajar' ? baseTdee-450 : (p.objetivo==='ganar' ? baseTdee+350 : baseTdee);
    if(baseKcal < 1200) baseKcal = 1200;

    var proteina = p.peso * 2.0;
    var proteinaKcal = proteina*4;
    var grasaKcal = baseKcal*0.25;
    var grasa = grasaKcal/9;

    var totalKcal = baseKcal + (burnHoy||0);
    var carbosKcal = Math.max(totalKcal - proteinaKcal - grasaKcal, 0);
    var carbos = carbosKcal/4;

    return {kcal:totalKcal, baseKcal:baseKcal, burnHoy:burnHoy||0, bmr:bmr, bmrFuente:bmrFuente, proteina:proteina, carbos:carbos, grasa:grasa};
  }

  function weeksToGoal(p, baseKcal, bmr){
    if(!p.pesoMeta || p.objetivo==='mantener') return null;
    var diffKg = p.objetivo==='bajar' ? (p.peso - p.pesoMeta) : (p.pesoMeta - p.peso);
    if(diffKg <= 0) return null;
    var dailyDelta = p.objetivo==='bajar' ? 450 : 350;
    var weeks = (diffKg * 7700) / (dailyDelta * 7);
    return Math.round(weeks);
  }

  // ---------- racha e insignias ----------
  function computeStreaks(){
    var todayComp = dayCompliance(todayKey());
    var d = new Date();
    if(!todayComp) d.setDate(d.getDate()-1);
    var current = 0, checking = true;
    while(checking){
      var key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      var comp = dayCompliance(key);
      if(comp && comp.good){ current++; d.setDate(d.getDate()-1); }
      else checking = false;
    }
    var dates = Object.keys(state.log).sort();
    var best=0, run=0, prevKey=null;
    dates.forEach(function(key){
      var comp = dayCompliance(key);
      if(comp && comp.good){
        if(prevKey){
          var diffDays = Math.round((new Date(key)-new Date(prevKey))/86400000);
          run = diffDays===1 ? run+1 : 1;
        } else run = 1;
        if(run>best) best = run;
        prevKey = key;
      } else { run=0; prevKey=null; }
    });
    best = Math.max(best, current);
    return {current:current, best:best};
  }

    return '<div class="card">' +
      '<h3>Tu racha 🔥</h3>' +

    if(!m.diaPago) return null;
    var base = new Date(m.ultimoPago || m.creadoEn || Date.now());
    var y = base.getFullYear(), mo = base.getMonth()+1; // un mes después de la base
    return new Date(y, mo, clampDay(y, mo, m.diaPago));
  }
  function paymentStatus(m){
    var due = nextPaymentDate(m);
    if(!due) return null;
    var days = Math.ceil((due - new Date()) / 86400000);
    return {due:due, daysLeft:days, overdue: days < 0};
  }

  function dateKeyFor(y,m,d){
    return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }

  function dayCompliance(dateKey){
    var entries = state.log[dateKey];
    if(!entries || !entries.length) return null;
    var totals = sumTotals(entries);
    var burnStore = loadLocal('macros_burn_v1', {});
    var targets = computeTargets(state.perfil, burnStore[dateKey] || 0);
    var proteinPct = targets.proteina ? (totals.proteina/targets.proteina*100) : 0;
    var kcalPct = targets.kcal ? (totals.kcal/targets.kcal*100) : 0;
    var good = proteinPct >= 90 && kcalPct >= 85 && kcalPct <= 115;
    return {totals:totals, targets:targets, proteinPct:proteinPct, kcalPct:kcalPct, good:good};
  }

  function renderCalendar(year, month){
    var first = new Date(year, month, 1);
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var startDow = first.getDay();
    var html = DOW.map(function(d){ return '<div class="calDow">'+d+'</div>'; }).join('');
    for(var i=0;i<startDow;i++) html += '<div class="calCell empty"></div>';
    var goodCount=0, partialCount=0, loggedCount=0;
    for(var d=1; d<=daysInMonth; d++){
      var key = dateKeyFor(year,month,d);
      var comp = dayCompliance(key);
      var cls = 'calCell';
      if(comp){ loggedCount++; cls += comp.good ? ' good' : ' partial'; if(comp.good) goodCount++; else partialCount++; }
      html += '<div class="'+cls+'">'+d+'</div>';
    }
    return {html:html, goodCount:goodCount, partialCount:partialCount, loggedCount:loggedCount, daysInMonth:daysInMonth};
  }

  function buildPctTrendChart(year, month){
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var points = [];
    for(var d=1; d<=daysInMonth; d++){
      var comp = dayCompliance(dateKeyFor(year,month,d));
      points.push(comp ? {kcal:comp.kcalPct, proteina:comp.proteinPct, carbos:(comp.totals.carbos/comp.targets.carbos*100)||0, grasa:(comp.totals.grasa/comp.targets.grasa*100)||0} : null);
    }
    var withData = points.filter(function(p){return p;});
    if(withData.length < 2){
      return '<p class="note">Con al menos dos días registrados en el mes aparecerá aquí la gráfica de cumplimiento.</p>';
    }
    var n = points.length;
    var W = Math.max(340, n*22), H = 150, padTop=10, padBottom=18, padX=8;
    var innerH = H-padTop-padBottom;
    var stepX = (W-padX*2)/(n-1);
    var maxPct = 150;
    function yFor(pct){ return padTop + (1-Math.min(pct,maxPct)/maxPct)*innerH; }

    var refY = yFor(100);
    var svg = '<line x1="'+padX+'" y1="'+refY.toFixed(1)+'" x2="'+(W-padX)+'" y2="'+refY.toFixed(1)+'" stroke="#2A362F" stroke-width="1" stroke-dasharray="3,3"></line>';

    var series = [
      {key:'proteina', color:'#3D7BFF', label:'Proteína'},
      {key:'carbos', color:'#F0B429', label:'Carbos'},
      {key:'grasa', color:'#9B8CF2', label:'Grasas'}
    ];
    var legend = '';
    series.forEach(function(ser){
      var path='', open=false, dots='';
      points.forEach(function(p,i){
        var x = padX+i*stepX;
        if(!p){ open=false; return; }
        var y = yFor(p[ser.key]);
        path += (open?'L':'M')+x.toFixed(1)+','+y.toFixed(1)+' ';
        open=true;
        dots += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="2" fill="'+ser.color+'"></circle>';
      });
      svg += '<path d="'+path.trim()+'" fill="none" stroke="'+ser.color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>'+dots;
      legend += '<span><i style="background:'+ser.color+';"></i>'+ser.label+'</span>';
    });
    var svgWrap = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">'+svg+'</svg>';
    return '<div class="trendScroll">'+svgWrap+'</div><div class="trendLegend">'+legend+'<span><i style="background:#2A362F;"></i>línea = 100% de tu meta</span></div>';
  }

        '<h3>Kcal de hoy</h3>' +
        '<div style="font-family:\'Big Shoulders Display\'; font-weight:700; font-size:30px;">' + fmt(totals.kcal) + ' <span style="font-size:15px; color:var(--text-muted); font-family:\'Work Sans\';">/ ' + fmt(targets.kcal) + ' kcal</span></div>' +
        '<p class="note" style="margin-top:4px;">Base: '+fmt(targets.baseKcal)+' kcal + entreno de hoy: '+fmt(targets.burnHoy)+' kcal · metabolismo basal: '+fmt(targets.bmr)+' kcal ('+targets.bmrFuente+')</p>' +
        '<div class="field" style="margin-top:10px;"><label>Calorías quemadas en tu entreno de hoy — '+WORKOUT_LABEL_BY_WEEKDAY[weekday]+'</label><input id="burnInput" type="number" value="'+burnHoy+'"></div>' +
        '<p class="note">Ajústalo si tu reloj o banda midió otro número.</p>' +
        weeksNote +
        tipHtml +
      '</div>' +
      renderStreakCard() +
      renderSupplementsCard() +
      '<div class="card">' +
        '<h3>Agregar alimento</h3>' +
        '<div class="addRow">' +
          '<div class="field"><label>¿Qué comiste?</label><input id="foodInput" list="foodOptions" placeholder="Ej. chilaquiles verdes con pollo" autocomplete="off"></div>' +
          '<div class="field qtyField"><label>Cant.</label><input id="foodQty" type="number" value="1" min="0.25" step="0.25"></div>' +
        '</div>' +
        '<datalist id="foodOptions">' + Object.keys(DEFAULT_FOODS).concat(Object.keys(state.cache)).map(function(k){ return '<option value="'+escapeHtml(k)+'">'; }).join('') + '</datalist>' +
        '<button class="btn btn-primary" id="addFoodBtn" style="width:100%; margin-top:8px;">Agregar</button>' +
        '<div id="estimateArea"></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>Hoy registraste</h3>' +
        '<div id="foodList">' + (entries.length ? '' : '<p class="note">Nada capturado todavía.</p>') + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h3>Compartir con tu entrenador</h3>' +
        '<button class="btn waBtn" id="waBtn">📲 Enviar resumen de hoy por WhatsApp</button>' +
      '</div>' +
      '<div class="card">' +
        '<h3>Mis datos</h3>' +
        '<p class="note">'+escapeHtml(state.perfil.nombre)+' · '+fmt(state.perfil.peso,0)+' kg · '+state.perfil.estatura+' cm · '+state.perfil.edad+' años · objetivo: '+objetivoLabel(state.perfil.objetivo)+'</p>' +
        '<button class="btn btn-ghost" id="editProfileBtn" style="padding:6px 0;">Editar mis datos →</button>' +
      '</div>' +
      '<div class="card" id="historialCard"></div>';

    renderFoodList(entries);
    if(state.isOwner) wireOwnerPanel();
    document.getElementById('editProfileBtn').addEventListener('click', renderOnboarding);
    document.getElementById('addFoodBtn').addEventListener('click', handleAddFood);
    document.getElementById('waBtn').addEventListener('click', sendWhatsapp);
    document.getElementById('creatinaBtn').addEventListener('click', toggleCreatina);
    document.getElementById('scoopBtn').addEventListener('click', toggleProteinScoop);
    document.getElementById('burnInput').addEventListener('change', function(){
      var val = parseFloat(document.getElementById('burnInput').value) || 0;
      saveTodaysBurn(val);
      renderMain();
    });
    renderHistorial();
  }

  function objetivoLabel(o){ return o==='bajar' ? 'bajar de peso' : o==='ganar' ? 'ganar masa muscular' : 'mantenerme'; }

  function renderFoodList(entries){
    var box = document.getElementById('foodList');
    if(!entries.length){ box.innerHTML = '<p class="note">Nada capturado todavía.</p>'; return; }
    box.innerHTML = entries.map(function(e, i){
      return '<div class="foodRow">' +
        '<span class="fname">'+escapeHtml(e.nombre)+(e.cantidad!==1?' ×'+e.cantidad:'')+'</span>' +
        '<span class="fmacros">'+fmt(e.kcal)+' kcal · '+fmt(e.proteina)+'g P</span>' +
        '<button class="fdel" data-i="'+i+'">✕</button>' +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.fdel'), function(btn){
      btn.addEventListener('click', function(){
        var i = parseInt(btn.getAttribute('data-i'), 10);
        var entries2 = todaysEntries();
        entries2.splice(i,1);
        state.log[todayKey()] = entries2;
        saveLog();
        renderMain();
      });
    });
  }

  function addEntry(nombre, cantidad, per){
    var entries = todaysEntries();
    entries.push({
      nombre: nombre, cantidad: cantidad,
      kcal: (per.kcal||0)*cantidad, proteina: (per.proteina||0)*cantidad,
      carbos: (per.carbos||0)*cantidad, grasa: (per.grasa||0)*cantidad
    });
    state.log[todayKey()] = entries;
    saveLog();
    renderMain();
  }

    async function handleAddFood(){
    var nombre = (document.getElementById('foodInput').value || '').trim();
    var cantidad = parseFloat(document.getElementById('foodQty').value) || 1;
    if(!nombre) return;
    var per = findFood(nombre);
    if(per){ addEntry(nombre, cantidad, per); return; }

    var area = document.getElementById('estimateArea');
    area.innerHTML = '<p class="note" style="margin-top:10px;">🤖 Consultando la IA sobre "'+escapeHtml(nombre)+'"…</p>';

    var est = null;
    try{
      var res = await fetch('/api/gemini', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          prompt: 'Da SOLO un JSON sin texto adicional ni bloques de código con esta forma exacta: {"kcal":numero,"proteina":numero,"carbos":numero,"grasa":numero}. ' +
                  'Estima el aporte nutrimental de UNA porción casera típica mexicana de: "' + nombre + '". ' +
                  'proteina, carbos y grasa en gramos; kcal totales de esa porción.'
        })
      });
      var data = await res.json();
      if(data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]){
        var texto = data.candidates[0].content.parts[0].text || '';
        texto = texto.replace(/```json/g,'').replace(/```/g,'').trim();
        var parsed = JSON.parse(texto);
        if(parsed && typeof parsed.kcal === 'number') est = parsed;
      }
    }catch(e){ est = null; }

    if(est){
      showEstimateForm(nombre, cantidad, est);
      return;
    }

    showEstimateForm(nombre, cantidad, {kcal:'', proteina:'', carbos:'', grasa:''});
  }
  function showEstimateForm(nombre, cantidad, est){
    var area = document.getElementById('estimateArea');
    area.innerHTML =
      '<div class="estimateBox">' +
        '<p class="note" style="margin:0 0 8px;">No estaba en la lista — revisa o completa los macros de "'+escapeHtml(nombre)+'" (por porción):</p>' +
        '<div class="row2">' +
          '<div class="field"><label>Kcal</label><input id="e_kcal" type="number" value="'+est.kcal+'"></div>' +
          '<div class="field"><label>Proteína (g)</label><input id="e_proteina" type="number" value="'+est.proteina+'"></div>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label>Carbos (g)</label><input id="e_carbos" type="number" value="'+est.carbos+'"></div>' +
          '<div class="field"><label>Grasa (g)</label><input id="e_grasa" type="number" value="'+est.grasa+'"></div>' +
        '</div>' +
        '<label style="display:flex; align-items:center; gap:6px; font-size:12.5px; margin-bottom:10px;"><input type="checkbox" id="e_save" checked style="width:auto;"> Guardar en mi lista para la próxima vez</label>' +
        '<button class="btn btn-primary" id="e_confirm" style="width:100%;">Agregar</button>' +
      '</div>';
    document.getElementById('e_confirm').addEventListener('click', function(){
      var per = {
        kcal: parseFloat(document.getElementById('e_kcal').value)||0,
        proteina: parseFloat(document.getElementById('e_proteina').value)||0,
        carbos: parseFloat(document.getElementById('e_carbos').value)||0,
        grasa: parseFloat(document.getElementById('e_grasa').value)||0
      };
      if(document.getElementById('e_save').checked){
        state.cache[nombre.trim().toLowerCase()] = per;
        saveCache();
      }
      addEntry(nombre, cantidad, per);
    });
  }

  initGate();
})();
</script>
</body>
</html>
